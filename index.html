<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ibnsina Digital Team Tasks Tracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230B6FC4%22/%3E%3Cpath d=%22M9 23 23 10M16 7v5M22 16h4M19 20l3 4%22 stroke=%22white%22 stroke-width=%222.6%22/%3E%3C/svg%3E">
  <meta name="theme-color" content="#0B6FC4">
  <script>
    try {
      var l = localStorage.getItem("dtt.lang") === "en" ? "en" : "ar", th = localStorage.getItem("dtt.theme");
      document.documentElement.lang = l; document.documentElement.dir = l === "en" ? "ltr" : "rtl";
      if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="root"><div class="boot"><div class="spinner"></div></div></div>
  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
